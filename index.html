<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status-Checker</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background-color: #1e1e1e;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 320px;
        }
        .status {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 1.5rem 0;
            padding: 1rem;
            border-radius: 8px;
        }
        .allowed { background-color: #1b4332; color: #52b788; }
        .denied { background-color: #4a0e17; color: #ff4d6d; }
        .info { color: #888888; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="card">
    <h2>Heutiger Status</h2>
    <div id="statusBox" class="status">Wird geladen...</div>
    <p id="infoText" class="info"></p>
</div>

<script>
    // 1. Fahrplan generieren: Startet exakt am 10. Oktober
    function generateSchedule() {
        let schedule = [];

        // Fester Start am 10. Oktober (z.B. 2023 oder 2024)
        // Format: Date(Jahr, MonatIndex [9 = Oktober], Tag)
        let startDate = new Date(2023, 9, 10);
        startDate.setHours(0, 0, 0, 0);

        let currentDate = new Date(startDate);

        // Fester Seed für deterministische/gleiche Ergebnisse bei jedem Aufruf
        let seed = 20231010;

        function seededRandom() {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        // Generiere ausreichend viele Einträge für z. B. 5 Jahre
        for (let i = 0; i < 1825; i++) {
            // Berechne, wie viele volle Monate seit dem 10. Oktober vergangen sind
            let yearsDiff = currentDate.getFullYear() - startDate.getFullYear();
            let monthsDiff = currentDate.getMonth() - startDate.getMonth();
            let totalMonthsPassed = yearsDiff * 12 + monthsDiff;

            // Wenn der aktuelle Tag noch vor dem 10. des Monats liegt, zählt dieser Monat noch nicht als voll vollendet
            if (currentDate.getDate() < 10) {
                totalMonthsPassed -= 1;
            }

            // Basisabstände berechnen:
            // Monat 0 (10. Okt): minGap = 2, maxGap = 3
            // Monat 1 (10. Nov): minGap = 3, maxGap = 5
            // Monat 2 (10. Dez): minGap = 4, maxGap = 7
            let minGap = 2 + totalMonthsPassed * 1;
            let maxGap = 3 + totalMonthsPassed * 2;
            let range = maxGap - minGap; // Spannweite für den Zufall

            // Datum zum Fahrplan hinzufügen
            schedule.push(new Date(currentDate).toISOString().split('T')[0]);

            // Nächsten Tag anhand des aktuellen Monatsabstands berechnen
            let daysToAdd = minGap + Math.floor(seededRandom() * (range + 1));
            currentDate.setDate(currentDate.getDate() + daysToAdd);
        }

        return schedule;
    }

    // 2. Heutiges Datum formatieren (YYYY-MM-DD)
    const today = new Date();
    const todayString = today.toISOString().split('T')[0];

    const schedule = generateSchedule();

    const statusBox = document.getElementById("statusBox");
    const infoText = document.getElementById("infoText");

    // 3. Prüfen, ob heute im generierten Fahrplan enthalten ist
    if (schedule.includes(todayString)) {
        statusBox.innerText = "Heute Erlaubt!";
        statusBox.className = "status allowed";
        infoText.innerText = "Genieße deine freie Wahl für heute.";
    } else {
        statusBox.innerText = "Heute Pause!";
        statusBox.className = "status denied";
        infoText.innerText = "Morgen ist ein neuer Tag. Bleib stark!";
    }
</script>

</body>
</html>
