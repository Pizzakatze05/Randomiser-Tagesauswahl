<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status-Checker</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background-color: #1e1e1e;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 320px;
        }
        .status {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 1.5rem 0;
            padding: 1rem;
            border-radius: 8px;
        }
        .allowed { background-color: #1b4332; color: #52b788; }
        .denied { background-color: #4a0e17; color: #ff4d6d; }
        .info { color: #888888; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="card">
    <h2>Heutiger Status</h2>
    <div id="statusBox" class="status">Wird geladen...</div>
    <p id="infoText" class="info"></p>
</div>

<script>
    // Hilfsfunktion: Formatierung YYYY-MM-DD ohne Zeitzonenfehler
    function formatDate(date) {
        let year = date.getFullYear();
        let month = String(date.getMonth() + 1).padStart(2, '0');
        let day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function generateSchedule() {
        let scheduleArray = [];

        // Startet am 10. Oktober 2023
        let startDate = new Date(2023, 9, 10);
        startDate.setHours(0, 0, 0, 0);

        let currentDate = new Date(startDate);
        let seed = 20231010;

        function seededRandom() {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        // Generiere ausreichend Tage für die Zukunft
        for (let i = 0; i < 2000; i++) {
            let yearsDiff = currentDate.getFullYear() - startDate.getFullYear();
            let monthsDiff = currentDate.getMonth() - startDate.getMonth();
            let totalMonthsPassed = yearsDiff * 12 + monthsDiff;

            if (currentDate.getDate() < 10) {
                totalMonthsPassed -= 1;
            }

            let minGap = 2 + totalMonthsPassed * 1;
            let maxGap = 3 + totalMonthsPassed * 2;
            let range = maxGap - minGap;

            scheduleArray.push(formatDate(currentDate));

            let daysToAdd = minGap + Math.floor(seededRandom() * (range + 1));
            currentDate.setDate(currentDate.getDate() + daysToAdd);
        }

        return scheduleArray;
    }

    // Fahrplan global verfügbar machen
    const schedule = generateSchedule();

    // UI aktualisieren, sobald das Dokument bereit ist
    document.addEventListener("DOMContentLoaded", function() {
        const today = new Date();
        const todayString = formatDate(today);

        const statusBox = document.getElementById("statusBox");
        const infoText = document.getElementById("infoText");

        if (schedule.includes(todayString)) {
            statusBox.innerText = "Heute Erlaubt!";
            statusBox.className = "status allowed";
            infoText.innerText = "Genieße deine freie Wahl für heute.";
        } else {
            statusBox.innerText = "Heute Pause!";
            statusBox.className = "status denied";
            infoText.innerText = "Morgen ist ein neuer Tag. Bleib stark!";
        }
    });
</script>

</body>
</html>
