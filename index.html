
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status-Checker</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background-color: #1e1e1e;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      max-width: 90%;
      width: 320px;
    }
    .status {
      font-size: 1.8rem;
      font-weight: bold;
      margin: 1.5rem 0;
      padding: 1rem;
      border-radius: 8px;
    }
    .allowed { background-color: #1b4332; color: #52b788; }
    .denied { background-color: #4a0e17; color: #ff4d6d; }
    .info { color: #888888; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="card">
  <h2>Heutiger Status</h2>
  <div id="statusBox" class="status">Wird geladen...</div>
  <p id="infoText" class="info"></p>
</div>

<script>
  // 1. Tag des Jahres berechnen (1 - 365/366)
  function getDayOfYear() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start;
    const oneDay = 1000 * 60 * 60 * 24;
    return Math.floor(diff / oneDay);
  }

  // 2. 52 Tage mit gleichmäßigem Abstand generieren
  function generateSchedule(year) {
    let schedule = [];
    let currentDay = Math.floor(Math.random() * 5) + 1;

    while (currentDay <= 365 && schedule.length < 52) {
      schedule.push(currentDay);
      // Ca. 5 bis 8 Tage Abstand zwischen den Erlaubten
      currentDay += 5 + Math.floor(Math.random() * 4);
    }

    localStorage.setItem(`schedule_${year}`, JSON.stringify(schedule));
    return schedule;
  }

  // 3. Status prüfen und anzeigen
  const currentYear = new Date().getFullYear();
  const currentDay = getDayOfYear();

  let schedule = JSON.parse(localStorage.getItem(`schedule_${currentYear}`));
  if (!schedule) {
    schedule = generateSchedule(currentYear);
  }

  const statusBox = document.getElementById("statusBox");
  const infoText = document.getElementById("infoText");

  if (schedule.includes(currentDay)) {
    statusBox.innerText = "HEUTE ERLAUBT";
    statusBox.className = "status allowed";
    infoText.innerText = "Genieße deine freie Wahl für heute.";
  } else {
    statusBox.innerText = "HEUTE PAUSE";
    statusBox.className = "status denied";
    infoText.innerText = "Morgen ist ein neuer Tag. Bleib stark!";
  }
</script>

</body>
</html>
