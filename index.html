<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status-Checker</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background-color: #1e1e1e;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 320px;
        }
        .status {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 1.5rem 0;
            padding: 1rem;
            border-radius: 8px;
        }
        .allowed { background-color: #1b4332; color: #52b788; }
        .denied { background-color: #4a0e17; color: #ff4d6d; }
        .info { color: #888888; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="card">
    <h2>Heutiger Status</h2>
    <div id="statusBox" class="status">Wird geladen...</div>
    <p id="infoText" class="info"></p>
</div>

<script>
    // 1. Tag des Jahres berechnen (1 - 365/366)
    function getDayOfYear() {
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 0);
        const diff = now - start;
        const oneDay = 1000 * 60 * 60 * 24;
        return Math.floor(diff / oneDay);
    }

    // 2. Einfacher Pseudo-Zufallsgenerator mit festem Seed (Linear Congruential Generator)
    function seededRandom(seed) {
        let x = Math.sin(seed++) * 10000;
        return x - Math.floor(x);
    }

    // 3. Fahrplan für das ganze Jahr deterministisch generieren
    function generateSchedule(year) {
        let schedule = [];
        let seed = year; // Das Jahr dient als gemeinsamer Startwert
        let currentDay = Math.floor(seededRandom(seed++) * 5) + 1;

        while (currentDay <= 365 && schedule.length < 52) {
            schedule.push(currentDay);
            currentDay += 2 + Math.floor(seededRandom(seed++) * 4);
        }
        
        return schedule;
    }

    // 4. Status prüfen und anzeigen
    const currentYear = new Date().getFullYear();
    const currentDay = getDayOfYear();
    
    const schedule = generateSchedule(currentYear);

    const statusBox = document.getElementById("statusBox");
    const infoText = document.getElementById("infoText");

    if (schedule.includes(currentDay)) {
        statusBox.innerText = "Heute Erlaubt!";
        statusBox.className = "status allowed";
        infoText.innerText = "Genieße deine freie Wahl für heute.";
    } else {
        statusBox.innerText = "Heute Pause!";
        statusBox.className = "status denied";
        infoText.innerText = "Morgen ist ein neuer Tag. Bleib stark!";
    }
</script>

</body>
</html>
