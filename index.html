<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status-Checker</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background-color: #1e1e1e;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 320px;
        }
        .status {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 1.5rem 0;
            padding: 1rem;
            border-radius: 8px;
        }
        .allowed { background-color: #1b4332; color: #52b788; }
        .denied { background-color: #4a0e17; color: #ff4d6d; }
        .info { color: #888888; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="card">
    <h2>Heutiger Status</h2>
    <div id="statusBox" class="status">Wird geladen...</div>
    <p id="infoText" class="info"></p>
</div>

<script>
    // 1. Fahrplan ab heute für die nächsten Monate generieren
    function generateSchedule() {
        let schedule = [];
        let startDate = new Date(); // Startet ab heute
        startDate.setHours(0, 0, 0, 0);

        let currentDate = new Date(startDate);

        // Seed für den Zufallsgenerator basierend auf dem Startdatum (Jahr + Monat)
        let seed = startDate.getFullYear() * 100 + startDate.getMonth();

        // Pseudo-Zufallsgenerator
        function seededRandom() {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        // Startwerte für den ersten Monat: Kleinere Zahl = 2, Spannweite = 1 (ergibt 2 bis 3 Tage)
        let minGap = 2;
        let range = 1;
        let currentMonth = currentDate.getMonth();

        // Generiere Einträge für z.B. die nächsten 2 Jahre (730 Tage)
        for (let i = 0; i < 730; i++) {
            // Prüfen, ob wir in einem neuen Monat sind
            if (currentDate.getMonth() !== currentMonth) {
                currentMonth = currentDate.getMonth();
                minGap += 1;  // Erhöht die kleinere Zahl um +1
                range += 1;   // Erhöht die größere Zahl zusätzlich um +1 (insgesamt +2 für das Maximum)
            }

            // Tag zum Zeitplan hinzufügen (als String im Format YYYY-MM-DD für den genauen Vergleich)
            schedule.push(new Date(currentDate).toISOString().split('T')[0]);

            // Nächsten Tag berechnen: minGap bis (minGap + range)
            let daysToAdd = minGap + Math.floor(seededRandom() * (range + 1));
            currentDate.setDate(currentDate.getDate() + daysToAdd);
        }

        return schedule;
    }

    // 2. Heutiges Datum formatieren (YYYY-MM-DD)
    const today = new Date();
    const todayString = today.toISOString().split('T')[0];

    const schedule = generateSchedule();

    const statusBox = document.getElementById("statusBox");
    const infoText = document.getElementById("infoText");

    // 3. Prüfen, ob heute im generierten Fahrplan enthalten ist
    if (schedule.includes(todayString)) {
        statusBox.innerText = "Heute Erlaubt!";
        statusBox.className = "status allowed";
        infoText.innerText = "Genieße deine freie Wahl für heute.";
    } else {
        statusBox.innerText = "Heute Pause!";
        statusBox.className = "status denied";
        infoText.innerText = "Morgen ist ein neuer Tag. Bleib stark!";
    }
</script>

</body>
</html>
